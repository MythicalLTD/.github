name: Publish actions release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Re-sync an existing release tag (e.g. v1.0.0)
        required: true
        type: string
      refresh_notes:
        description: Replace the auto-generated usage block on the release
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REFRESH: ${{ inputs.refresh_notes }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "release" ]; then
            tag="${RELEASE_TAG}"
            prerelease="${RELEASE_PRERELEASE}"
            refresh="false"
          else
            tag="${INPUT_TAG}"
            prerelease="$(gh release view "${tag}" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo false)"
            refresh="${INPUT_REFRESH}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "refresh_notes=${refresh}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${tag} (prerelease: ${prerelease})"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.tag }}
          fetch-depth: 0

      - name: Validate tag and resolve major version
        id: meta
        shell: bash
        env:
          TAG: ${{ steps.context.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be semver (e.g. v1.0.0). Got: ${TAG}"
            exit 1
          fi

          major="v$(echo "${TAG#v}" | cut -d. -f1)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - name: Verify actions and scripts
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for action in build-fpa publish-release build-and-release; do
            if [[ ! -f "actions/${action}/action.yml" ]]; then
              echo "::error::Missing actions/${action}/action.yml"
              missing=1
            fi
          done

          for script in build-fpa.sh publish-release.sh; do
            if [[ ! -f "scripts/${script}" ]]; then
              echo "::error::Missing scripts/${script}"
              missing=1
            fi
          done

          if (( missing )); then
            exit 1
          fi

          echo "All 3 actions verified: build-fpa, publish-release, build-and-release"

      - name: Update moving major tag
        if: steps.context.outputs.prerelease == 'false'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          MAJOR: ${{ steps.meta.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${MAJOR}" "${TAG}" -m "Track latest ${MAJOR}.x (${TAG})"
          git push origin "${MAJOR}" --force
          echo "Moved ${MAJOR} → ${TAG}"

      - name: Update release notes
        if: steps.context.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          MAJOR: ${{ steps.meta.outputs.major }}
          REFRESH: ${{ steps.context.outputs.refresh_notes }}
        shell: bash
        run: |
          set -euo pipefail

          existing="$(gh release view "${TAG}" --json body --jq .body)"

          if [[ "${REFRESH}" == "true" && "${existing}" == *"## Actions in this release"* ]]; then
            existing="$(printf '%s' "${existing}" | sed '/^---$/,$d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
          elif [[ "${existing}" == *"actions/build-fpa@"* ]]; then
            echo "Usage block already present — skipping (use workflow_dispatch + refresh_notes to replace)"
            exit 0
          fi

          {
            printf '%s\n\n---\n\n' "${existing}"
            printf '## Actions in this release\n\n'
            printf 'All **3 actions** ship at the same tag (`%s` / `%s`):\n\n' "${TAG}" "${MAJOR}"
            printf '| Action | Use case |\n'
            printf '| --- | --- |\n'
            printf '| [`build-fpa`](https://github.com/MythicalLTD/.github/tree/%s/actions/build-fpa) | Build `.fpa` only (compiler) |\n' "${TAG}"
            printf '| [`publish-release`](https://github.com/MythicalLTD/.github/tree/%s/actions/publish-release) | Upload to marketplace only |\n' "${TAG}"
            printf '| [`build-and-release`](https://github.com/MythicalLTD/.github/tree/%s/actions/build-and-release) | Build `.fpa` + upload |\n\n' "${TAG}"
            printf '### Usage\n\n'
            printf '```yaml\n'
            printf '%s\n' '# Build .fpa only'
            printf '%s\n\n' "- uses: MythicalLTD/.github/actions/build-fpa@${MAJOR}"
            printf '%s\n' '# Upload an existing file'
            printf '%s\n\n' "- uses: MythicalLTD/.github/actions/publish-release@${MAJOR}"
            printf '%s\n' '# Build + upload'
            printf '%s\n' "- uses: MythicalLTD/.github/actions/build-and-release@${MAJOR}"
            printf '```\n\n'
            printf 'Exact pin: `@%s` · Docs: https://github.com/MythicalLTD/.github/blob/main/docs/getting-started.md\n' "${TAG}"
          } > /tmp/release-notes.md

          gh release edit "${TAG}" --notes-file /tmp/release-notes.md

      - name: Write job summary
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          MAJOR: ${{ steps.meta.outputs.major }}
          IS_PRERELEASE: ${{ steps.context.outputs.prerelease }}
        run: |
          {
            echo "## Actions release published"
            echo ""
            echo "**3 actions** at \`${TAG}\` (pin \`${MAJOR}\`):"
            echo ""
            echo "| Action | Path |"
            echo "| --- | --- |"
            echo "| build-fpa | \`actions/build-fpa\` |"
            echo "| publish-release | \`actions/publish-release\` |"
            echo "| build-and-release | \`actions/build-and-release\` |"
            echo ""
            if [[ "${IS_PRERELEASE}" == "false" ]]; then
              echo "Moving tag **${MAJOR}** → **${TAG}**"
            else
              echo "Prerelease — major tag not updated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
