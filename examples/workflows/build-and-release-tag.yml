# Build .fpa and publish on tag — action syntax (recommended).
#
# Copy to: .github/workflows/release-fpa.yml

name: Release FPA

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: MythicalLTD/.github/actions/build-and-release@v1
        with:
          product_id: "123"
          environment: dev
          changelog: ${{ github.event.head_commit.message }}
          release_token: ${{ secrets.MYTHIC_RELEASE_TOKEN }}
