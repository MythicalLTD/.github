# PHP-only FeatherPanel addon — no Node.js, no frontend build.
#
# Copy to: .github/workflows/build-fpa.yml

name: Build FPA (PHP only)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: MythicalLTD/.github/actions/build-fpa@v1
        with:
          build_frontend: "false"
          package_manager: none

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: MythicalLTD/.github/actions/build-and-release@v1
        with:
          product_id: "123"
          environment: production
          changelog: "Release ${{ github.ref_name }}"
          build_frontend: "false"
          package_manager: none
          release_token: ${{ secrets.MYTHIC_RELEASE_TOKEN }}
