# Plugin lives inside a monorepo (not at the repository root).
#
# Copy to: .github/workflows/build-fpa.yml

name: Build FPA (monorepo)

on:
  push:
    paths:
      - "backend/storage/addons/myaddon/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: MythicalLTD/.github/actions/build-fpa@v1
        with:
          plugin_dir: backend/storage/addons/myaddon
          frontend_dir: Frontend/App
          package_manager: pnpm
